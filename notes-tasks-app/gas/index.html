<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <?!= include('styles'); ?>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 dark:bg-slate-950 min-h-screen font-sans transition-colors duration-300">

    <!-- Navbar -->
    <nav class="bg-indigo-600 dark:bg-indigo-900 text-white shadow-lg p-4 sticky top-0 z-50 transition-colors">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i data-lucide="check-square"></i>
                <span>TaskMaster Pro</span>
            </h1>
            <div class="flex items-center gap-4">
                <button id="dark-mode-toggle" class="p-2 rounded-full hover:bg-indigo-500 transition">
                    <i data-lucide="moon" id="dark-icon" class="w-5 h-5"></i>
                </button>
                <button id="btn-new-task" class="bg-white text-indigo-600 px-4 py-2 rounded-lg font-semibold hover:bg-indigo-50 transition flex items-center gap-2">
                    <i data-lucide="plus"></i> <span class="hidden sm:inline">Nueva Tarea</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 sm:p-6">

        <!-- Filters & Search -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4 mb-6 flex flex-wrap gap-4 items-end transition-colors">
            <div class="flex-1 min-w-[200px]">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Buscar</label>
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-2.5 text-gray-400 w-4 h-4"></i>
                    <input type="text" id="search-input" placeholder="Título o descripción..." class="pl-10 w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Estado</label>
                <select id="filter-status" class="rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="Todos">Todos</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="En desarrollo">En desarrollo</option>
                    <option value="Finalizada">Finalizada</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Prioridad</label>
                <select id="filter-priority" class="rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="Todas">Todas</option>
                    <option value="Alta">Alta</option>
                    <option value="Media">Media</option>
                    <option value="Baja">Baja</option>
                </select>
            </div>
            <div class="flex items-center gap-2 bg-gray-100 dark:bg-gray-700 p-1 rounded-lg">
                <button id="view-list" class="p-2 rounded bg-white dark:bg-gray-600 shadow-sm text-indigo-600 dark:text-indigo-300"><i data-lucide="list"></i></button>
                <button id="view-kanban" class="p-2 rounded text-gray-500 dark:text-gray-400 hover:bg-white dark:hover:bg-gray-600 hover:shadow-sm"><i data-lucide="columns"></i></button>
            </div>
        </div>

        <!-- List View -->
        <div id="list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div id="loading-spinner" class="col-span-full text-center py-20 text-gray-500">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full mb-4"></div>
                <p>Cargando tus tareas...</p>
            </div>
        </div>

        <!-- Kanban View -->
        <div id="kanban-container" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="kanban-column dark:bg-gray-800/50" data-status="Pendiente">
                <h3 class="font-bold text-gray-600 dark:text-gray-400 mb-4 flex items-center gap-2 uppercase tracking-wider text-sm">
                    <span class="w-3 h-3 bg-yellow-400 rounded-full"></span> Pendiente
                </h3>
                <div class="kanban-tasks space-y-4"></div>
            </div>
            <div class="kanban-column dark:bg-gray-800/50" data-status="En desarrollo">
                <h3 class="font-bold text-gray-600 dark:text-gray-400 mb-4 flex items-center gap-2 uppercase tracking-wider text-sm">
                    <span class="w-3 h-3 bg-blue-500 rounded-full"></span> En desarrollo
                </h3>
                <div class="kanban-tasks space-y-4"></div>
            </div>
            <div class="kanban-column dark:bg-gray-800/50" data-status="Finalizada">
                <h3 class="font-bold text-gray-600 dark:text-gray-400 mb-4 flex items-center gap-2 uppercase tracking-wider text-sm">
                    <span class="w-3 h-3 bg-green-500 rounded-full"></span> Finalizada
                </h3>
                <div class="kanban-tasks space-y-4"></div>
            </div>
        </div>
    </main>

    <!-- Task Modal -->
    <div id="task-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto transition-colors">
            <div class="p-6 border-b dark:border-gray-700 flex justify-between items-center">
                <h2 id="modal-title" class="text-xl font-bold text-gray-800 dark:text-white">Nueva Tarea</h2>
                <button class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 close-modal">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <form id="task-form" class="p-6 space-y-4">
                <input type="hidden" id="task-id">

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Título *</label>
                    <input type="text" id="task-title" required class="w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Descripción</label>
                    <textarea id="task-desc" rows="3" class="w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Estado</label>
                        <select id="task-status" class="w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2.5">
                            <option value="Pendiente">Pendiente</option>
                            <option value="En desarrollo">En desarrollo</option>
                            <option value="Finalizada">Finalizada</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Prioridad</label>
                        <select id="task-priority" class="w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2.5">
                            <option value="Baja">Baja</option>
                            <option value="Media" selected>Media</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Fecha Límite</label>
                        <input type="date" id="task-deadline" class="w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2.5">
                    </div>
                    <div class="flex items-center gap-2 pt-6">
                        <input type="checkbox" id="task-notify" class="w-4 h-4 text-indigo-600 rounded">
                        <label for="task-notify" class="text-sm text-gray-700 dark:text-gray-300 font-medium">Notificar por email</label>
                    </div>
                </div>

                <!-- Checklist Section -->
                <div class="border-t dark:border-gray-700 pt-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Checklist</label>
                    <div id="checklist-items" class="space-y-2 mb-2">
                        <!-- Items here -->
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="new-item-text" placeholder="Añadir item..." class="flex-1 rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2 text-sm">
                        <button type="button" id="btn-add-item" class="bg-gray-100 dark:bg-gray-600 text-gray-600 dark:text-gray-200 px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-500">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Notas Previas Section -->
                <div class="border-t dark:border-gray-700 pt-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Notas Previas (Preparación)</label>
                    <div id="notas-previas-items" class="space-y-2 mb-2">
                        <!-- Notas here -->
                    </div>
                    <div class="space-y-2">
                        <div class="flex gap-2">
                            <input type="date" id="note-previa-date" class="rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2 text-sm">
                            <input type="text" id="note-previa-text" placeholder="Nueva nota previa..." class="flex-1 rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2 text-sm">
                            <button type="button" id="btn-add-note-previa" class="bg-gray-100 dark:bg-gray-600 text-gray-600 dark:text-gray-200 px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-500">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Notas de la Reunión Section -->
                <div class="border-t dark:border-gray-700 pt-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Notas de la Reunión (Acuerdos)</label>
                    <div id="notas-reunion-items" class="space-y-2 mb-2">
                        <!-- Notas here -->
                    </div>
                    <div class="space-y-2">
                        <div class="flex gap-2">
                            <input type="date" id="note-reunion-date" class="rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2 text-sm">
                            <input type="text" id="note-reunion-text" placeholder="Acuerdo o nota de reunión..." class="flex-1 rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white border p-2 text-sm">
                            <button type="button" id="btn-add-note-reunion" class="bg-gray-100 dark:bg-gray-600 text-gray-600 dark:text-gray-200 px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-500">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" class="px-6 py-2 border dark:border-gray-600 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 close-modal">Cancelar</button>
                    <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold shadow-md">Guardar Tarea</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-[200]">
        <div class="bg-gray-800 dark:bg-gray-700 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3">
            <span id="toast-msg">Tarea guardada correctamente</span>
        </div>
    </div>

    <?!= include('javascript'); ?>
</body>
</html>
